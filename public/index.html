<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CloudHoot - Direct</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; overflow: hidden; touch-action: none; }
        body, html { width: 100%; height: 100%; background: #000; display: flex; align-items: center; justify-content: center; }
        #canvas { background: #111; cursor: pointer; width: 100vw; height: 100vh; object-fit: contain; }
        #keyboard-btn {
            position: fixed; bottom: 12px; right: 12px;
            background: rgba(0, 0, 0, 0.8); color: #00ffcc;
            border: 1px solid #00ffcc; padding: 10px 16px;
            font-size: 15px; border-radius: 8px; z-index: 999;
        }
    </style>
</head>
<body>

    <canvas id="canvas" width="1024" height="600"></canvas>
    <button id="keyboard-btn" onclick="openInput()">⌨️ Escribir (PIN/Apodo)</button>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        var socket = io();
        var canvas = document.getElementById('canvas');
        var ctx = canvas.getContext('2d');

        socket.on('frame', function(base64Image) {
            var img = new Image();
            img.onload = function() {
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            };
            img.src = 'data:image/jpeg;base64,' + base64Image;
        });

        function sendTap(clientX, clientY) {
            var rect = canvas.getBoundingClientRect();
            var scaleX = canvas.width / rect.width;
            var scaleY = canvas.height / rect.height;

            var realX = Math.round((clientX - rect.left) * scaleX);
            var realY = Math.round((clientY - rect.top) * scaleY);

            socket.emit('tap', { x: realX, y: realY });
        }

        canvas.addEventListener('touchstart', function(e) {
            e.preventDefault();
            if (e.touches.length > 0) {
                sendTap(e.touches[0].clientX, e.touches[0].clientY);
            }
        }, false);

        canvas.addEventListener('mousedown', function(e) {
            sendTap(e.clientX, e.clientY);
        }, false);

        function openInput() {
            var text = prompt("Introduce texto (PIN o Nombre):");
            if (text && text.trim() !== "") {
                socket.emit('type_text', text);
            }
        }
    </script>
</body>
</html>
