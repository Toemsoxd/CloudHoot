<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CloudHoot - Stream Visor</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; overflow: hidden; }
        body, html { width: 100%; height: 100%; background: #000; display: flex; align-items: center; justify-content: center; }
        #canvas { background: #111; width: 100vw; height: 100vh; object-fit: contain; }
    </style>
</head>
<body>

    <canvas id="canvas" width="1024" height="600"></canvas>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        var socket = io();
        var canvas = document.getElementById('canvas');
        var ctx = canvas.getContext('2d');

        socket.on('frame', function(base64Image) {
            var img = new Image();
            img.onload = function() {
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            };
            img.src = 'data:image/jpeg;base64,' + base64Image;
        });
    </script>
</body>
</html>
